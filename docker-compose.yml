services:
  postgres:
    image: postgres:18-alpine
    container_name: nexus-estate-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  api-gateway:
    build:
      context: .
      target: development
    container_name: nexus-estate-api-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      # Override DB_HOST để trỏ vào container postgres (không dùng localhost)
      - DB_POSTGRES_HOST=postgres
    volumes:
      - .:/app
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm ci && npm run start:dev"
    networks:
      - nexus-network

volumes:
  postgres_data:
    driver: local
  api_gateway_node_modules:
    driver: local

networks:
  nexus-network:
    driver: bridge