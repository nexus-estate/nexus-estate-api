services:
  postgres:
    image: postgres:18-alpine
    container_name: nexus-estate-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  api-gateway:
    build:
      context: .
      target: development
    container_name: nexus-estate-api-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-50001}:${PORT:-50001}"
    env_file:
      - .env
    environment:
      - DB_POSTGRES_HOST=postgres
      - DB_POSTGRES_PORT=5432
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network

volumes:
  postgres_data:
    driver: local

networks:
  nexus-network:
    driver: bridge