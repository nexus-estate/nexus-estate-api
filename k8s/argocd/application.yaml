# =============================================================================
# Argo CD Application manifest for Nexus Estate API Gateway
# =============================================================================
# This Application tells Argo CD to sync the Kubernetes manifests from this
# Git repository and deploy them to the k3s cluster.
#
# Usage:
#   kubectl apply -f k8s/argocd/application.yaml --namespace=argocd
#
# Then access the Argo CD UI: https://argocd.nexus-estate.local
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  labels:
    app: api-gateway
    service: nexus-estate
spec:
  project: default

  # Source: Git repository containing the Kubernetes manifests
  source:
    repoURL: https://github.com/tiesn/nexus-estate.git
    targetRevision: main
    path: api-gateway/k8s/overlays/production

  # Destination: k3s cluster, nexus-estate namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: nexus-estate

  # Sync policy: automatic with pruning and self-heal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - Validate=true

  # Health check for the application
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas