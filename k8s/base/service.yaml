# =============================================================================
# Kubernetes Service for Nexus Estate API Gateway
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    service: nexus-estate
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 50001
      protocol: TCP
  selector:
    app: api-gateway