# =============================================================================
# Kubernetes Deployment for Nexus Estate API Gateway
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    service: nexus-estate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        service: nexus-estate
    spec:
      # Use a node selector to schedule on specific nodes if needed
      # nodeSelector:
      #   kubernetes.io/role: worker
      containers:
        - name: api-gateway
          image: ghcr.io/tiesn/nexus-estate/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 50001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 50001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
      # Pull the image from GHCR using the image pull secret
      imagePullSecrets:
        - name: ghcr-secret