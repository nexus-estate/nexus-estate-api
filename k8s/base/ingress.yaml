# =============================================================================
# Kubernetes Ingress for Nexus Estate API Gateway
# =============================================================================
# Exposes the API Gateway service externally via an Ingress controller.
# Requires an Ingress controller (e.g., Traefik, NGINX Ingress) installed on the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    service: nexus-estate
  annotations:
    # Use Traefik as the Ingress controller (default for k3s)
    kubernetes.io/ingress.class: "traefik"
    # Enable SSL redirect (requires cert-manager or Traefik default cert)
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: api.nexus-estate.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
  # Uncomment and configure for TLS with cert-manager:
  # tls:
  #   - hosts:
  #       - api.nexus-estate.local
  #     secretName: api-gateway-tls