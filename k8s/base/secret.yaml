# =============================================================================
# Kubernetes (External) Secret for Nexus Estate API Gateway
# =============================================================================
# This is a placeholder manifest documenting the required secret keys.
# In production, create the actual secret using:
#
#   kubectl create secret generic api-gateway-secret \
#     --namespace=nexus-estate \
#     --from-literal=DB_POSTGRES_USER=postgres \
#     --from-literal=DB_POSTGRES_PASS=your-password-here
#
# Or use SealedSecrets / External Secrets Operator for GitOps.
#
# WARNING: Do NOT commit plaintext secrets to Git!
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  labels:
    app: api-gateway
    service: nexus-estate
type: Opaque
stringData:
  # These are placeholder values — override them with production credentials.
  DB_POSTGRES_USER: "postgres"
  DB_POSTGRES_PASS: "changeme-in-production"