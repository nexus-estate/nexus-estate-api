# =============================================================================
# Kustomize Base Configuration for Nexus Estate API Gateway
# =============================================================================
# This is the base kustomization that all environment overlays reference.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-estate

commonLabels:
  app: api-gateway
  service: nexus-estate
  managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - ingress.yaml

