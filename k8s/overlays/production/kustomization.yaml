# =============================================================================
# Production Overlay for Nexus Estate API Gateway
# =============================================================================
# Overlays the base configuration with production-specific settings:
#   - 3 replicas for high availability
#   - Production environment variables
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-estate

resources:
  - ../../base

commonLabels:
  environment: production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api-gateway

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - NODE_ENV=production